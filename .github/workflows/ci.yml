name: ci
on: [push, pull_request]

jobs:
  opam:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ocaml: 5
          - os: ubuntu-latest
            ocaml: 4
          - os: ubuntu-latest
            ocaml: 4.11.0
          - os: macos-latest
            ocaml: 4
          - os: windows-latest
            ocaml: 4
          - os: ubuntu-24.04
            ocaml: ocaml-variants.5.5.1+options,ocaml-option-static
            static: true
          - os: ubuntu-24.04-arm
            ocaml: ocaml-variants.5.5.1+options,ocaml-option-static
            static: true
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}

      - run: opam install -y --deps-only .

      - if: ${{ !matrix.static }}
        run: opam exec -- dune build -p luv

      - name: Test a luv user linking luv into a static executable
        if: ${{ matrix.static }}
        run: |
          opam pin add --yes --no-action --kind=path luv.dev .
          opam install --yes luv ocamlfind
          opam exec -- ocamlfind ocamlopt -thread -package luv -linkpkg \
            -ccopt -static -o hello_world example/hello_world.ml
          file hello_world | grep 'statically linked'
          ./hello_world

  old-libuv:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.x
      - run: opam install -y --deps-only .
      - run: git clone https://github.com/libuv/libuv.git
        working-directory: ..
      - run: |
          git checkout v1.3.0
          ./autogen.sh
          sh configure
          make
          sh libtool --mode install cp libuv.la $(pwd)
        working-directory: ../libuv
      - run: opam exec -- dune build -p luv
        env:
          LUV_USE_SYSTEM_LIBUV: yes
          C_INCLUDE_PATH: ${{ github.workspace }}/../libuv/include
          LIBRARY_PATH: ${{ github.workspace }}/../libuv

  # esy builds are broken due to an upstream bug that is not worth working
  # around in luv, but should be fixed in esy:
